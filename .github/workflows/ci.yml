name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Brewtifyer builds cgo bridges against Foundation, ServiceManagement and
    # UserNotifications, so it can only be verified on a macOS runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # format.sh rewrites files, which CI cannot detect. Assert instead.
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tools)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Vet
        run: ./Build/vet.sh

      - name: Verify localization catalogs
        run: ./Build/localization.sh

      - name: Test
        run: go test -race ./...

      - name: Build app bundle
        run: ./Build/build.sh

      - name: Verify embedded version metadata
        run: |
          dist/Brewtifyer.app/Contents/MacOS/Brewtifyer --version
          # A universal bundle must carry both slices.
          lipo -archs dist/Brewtifyer.app/Contents/MacOS/Brewtifyer

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
