name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Brewtifyer builds cgo bridges against Foundation, ServiceManagement and
    # UserNotifications, so it can only be verified on a macOS runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # format.sh rewrites files, which CI cannot detect. Assert instead.
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tools)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Vet
        run: ./Build/vet.sh

      - name: Verify localization catalogs
        run: ./Build/localization.sh

      - name: Test
        run: go test -race ./...

      - name: Build app bundle
        run: ./Build/build.sh

      - name: Verify embedded version metadata
        run: |
          dist/Brewtifyer.app/Contents/MacOS/Brewtifyer --version
          # A universal bundle must carry both slices.
          lipo -archs dist/Brewtifyer.app/Contents/MacOS/Brewtifyer

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

  dependency-review:
    # Keep this name stable: the main-branch ruleset requires this check.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true
